[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pairscope"
version = "0.1.0"
description = "Renderer-observable paired residual coordinates"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "christopherohit" }]
dependencies = ["numpy>=1.24"]

[tool.setuptools]
py-modules = ["pairscope"]
